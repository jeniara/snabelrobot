<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snabelrobot stereo</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#11171c;color:#edf3f7}body{margin:0}.top{display:flex;justify-content:space-between;padding:14px 18px;background:#202a33}.wrap{padding:14px;display:grid;gap:14px}.feeds{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#20272e;border:1px solid #35404a;border-radius:10px;padding:12px}img{display:block;width:100%;border-radius:6px;background:#080b0e}.status{display:flex;gap:20px;flex-wrap:wrap;align-items:center}.distance{font-size:2rem;font-weight:600}button{padding:10px;border-radius:7px;background:#34414b;color:#fff;border:1px solid #52606b}@media(max-width:700px){.feeds{grid-template-columns:1fr}}
</style></head><body><header class="top"><b>Snabelrobot · stereokamera</b><span>Baslinje 3,45 cm</span></header><main class="wrap"><section class="status panel"><span>Status: <b id="cal">läser…</b></span><span>Närmaste stabila avstånd: <span class="distance" id="distance">–</span></span><button id="capture">Spara kalibreringspar</button></section><div class="feeds"><section class="panel"><h2>Vänster kamera</h2><img src="/stream/left"></section><section class="panel"><h2>Höger kamera</h2><img src="/stream/right"></section></div><section class="panel"><h2>Djupkarta</h2><img id="depth" src="/stream/depth"><p id="hint">Djupkartan aktiveras efter stereokalibrering.</p></section></main><script>
const q=s=>document.querySelector(s);async function update(){const d=await fetch('/api/status').then(r=>r.json());q('#cal').textContent=d.calibrated?'kalibrerad':'kalibrering krävs';q('#distance').textContent=d.distance_m?d.distance_m.toFixed(2)+' m':'–';q('#hint').textContent=d.calibrated?'Giltiga djuppixlar: '+(100*d.valid_fraction).toFixed(1)+' %':'Ta minst 10 schackbrädepar från varierade vinklar.'}q('#capture').onclick=async()=>{const d=await fetch('/api/capture-calibration',{method:'POST'}).then(r=>r.json());q('#hint').textContent='Kalibreringspar '+d.pair+' sparat.'};setInterval(update,500);update();
</script></body></html>
